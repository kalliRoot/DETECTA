<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DETECTA — Scanner Biométrico</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <!-- MediaPipe (versão clássica e estável) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

    <style>
        :root{
            --cyan: #00ffcc;
            --cyan-dim: rgba(0,255,204,0.25);
            --red: #ff3366;
            --amber: #ffcc44;
            --bg: #07090a;
            --panel: #0e1213;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #0e1616 0%, #07090a 55%, #050606 100%);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
            padding: 20px; color: #cfe; letter-spacing: 0.3px;
        }
        .container {
            background: linear-gradient(180deg, #101615 0%, #0a0e0d 100%);
            border: 1px solid var(--cyan-dim);
            border-radius: 18px;
            padding: 22px;
            max-width: 900px; width: 100%;
            box-shadow: 0 0 80px rgba(0,255,200,0.06), inset 0 0 60px rgba(0,255,200,0.02);
            position: relative;
        }
        .container::before{
            content:""; position:absolute; inset:0; border-radius:18px; pointer-events:none;
            background: repeating-linear-gradient(0deg, rgba(0,255,204,0.015) 0px, rgba(0,255,204,0.015) 1px, transparent 1px, transparent 3px);
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--cyan-dim); padding-bottom: 12px; margin-bottom: 16px;
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif; color: var(--cyan); font-size: 19px;
            letter-spacing: 4px; text-transform: uppercase; font-weight: 700;
            text-shadow: 0 0 18px rgba(0,255,204,0.5);
        }
        .header .sub { display:block; font-size:9px; color:#5c7d78; letter-spacing:2px; margin-top:3px; font-weight:400;}
        .header .badge {
            color: var(--red); font-size: 11px; border: 1px solid rgba(255,51,102,0.4);
            padding: 5px 14px; border-radius: 20px; letter-spacing: 1.5px; font-family:'Orbitron',sans-serif;
            box-shadow: 0 0 14px rgba(255,51,102,0.15);
        }

        .video-wrapper {
            position: relative; border-radius: 14px; overflow: hidden; background: #000;
            border: 1px solid var(--cyan-dim); max-width: 640px; margin: 0 auto;
            aspect-ratio: 4 / 3;
        }
        #webcam { width: 100%; height: 100%; display: block; object-fit: cover; transform: scaleX(-1); background: #000; filter: contrast(1.05) saturate(0.9); }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(-1); }

        /* grid tático de fundo */
        .tac-grid{
            position:absolute; inset:0; pointer-events:none; opacity:0.35;
            background-image:
                linear-gradient(rgba(0,255,204,0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,204,0.06) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* cantos estilo mira */
        .corner{ position:absolute; width:26px; height:26px; border-color: var(--cyan); opacity:0.85; pointer-events:none; z-index:3; }
        .corner.tl{ top:8px; left:8px; border-top:2px solid var(--cyan); border-left:2px solid var(--cyan); }
        .corner.tr{ top:8px; right:8px; border-top:2px solid var(--cyan); border-right:2px solid var(--cyan); }
        .corner.bl{ bottom:8px; left:8px; border-bottom:2px solid var(--cyan); border-left:2px solid var(--cyan); }
        .corner.br{ bottom:8px; right:8px; border-bottom:2px solid var(--cyan); border-right:2px solid var(--cyan); }

        /* linha de varredura */
        .scanline{
            position:absolute; left:0; width:100%; height:2px;
            background: linear-gradient(90deg, transparent, var(--cyan) 45%, var(--cyan) 55%, transparent);
            box-shadow: 0 0 12px 2px var(--cyan);
            opacity:0; pointer-events:none; z-index:3;
        }
        .scanline.ativo{ animation: varrer 2.6s linear infinite; opacity:0.8; }
        @keyframes varrer{ 0%{ top:0%; } 100%{ top:100%; } }

        .rec-indicator{
            position:absolute; top:10px; right:10px; z-index:4; display:none; align-items:center; gap:6px;
            background: rgba(0,0,0,0.55); border:1px solid rgba(255,51,102,0.5); border-radius:20px;
            padding:4px 10px; font-size:10px; color:var(--red); letter-spacing:1.5px; font-family:'Orbitron',sans-serif;
        }
        .rec-indicator.ativo{ display:flex; }
        .rec-indicator .dot{ width:7px; height:7px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red); animation: piscar 1s infinite; }
        @keyframes piscar{ 0%,100%{opacity:1;} 50%{opacity:0.15;} }

        .id-tag{
            position:absolute; bottom:10px; left:10px; z-index:4; font-size:9px; color: var(--cyan);
            opacity:0; background: rgba(0,0,0,0.5); padding:4px 8px; border-radius:6px; border:1px solid var(--cyan-dim);
            font-family:'Orbitron', sans-serif; letter-spacing:1px; transition: opacity 0.3s;
        }
        .id-tag.ativo{ opacity:0.9; }

        .audio-visualizer { max-width: 640px; margin: 12px auto 0; border-radius: 8px; overflow: hidden; background: #05070706; border: 1px solid var(--cyan-dim); height: 50px; }
        #audioCanvas { width: 100%; height: 100%; display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
        .stat-box {
            background: linear-gradient(180deg, #141a19, #0c1010); border: 1px solid var(--cyan-dim);
            border-radius: 10px; padding: 11px 10px; text-align: center; position:relative; overflow:hidden;
        }
        .stat-box::after{ content:""; position:absolute; top:0; left:0; width:100%; height:2px; background:var(--cyan); opacity:0.35; }
        .stat-box .label { color: #7fa39c; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; }
        .stat-box .value { font-family:'Orbitron',sans-serif; color: var(--cyan); font-size: 21px; font-weight: 700; margin-top: 5px; text-shadow: 0 0 10px rgba(0,255,204,0.35); }
        .stat-box .value.verde { color: #66ff99; text-shadow: 0 0 10px rgba(102,255,153,0.4); }
        .stat-box .value.vermelho { color: var(--red); text-shadow: 0 0 10px rgba(255,51,102,0.4); }
        .stat-box .value.amarelo { color: var(--amber); text-shadow: 0 0 10px rgba(255,204,68,0.4); }

        .controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 16px 0; }
        .btn {
            background: transparent; border: 1px solid var(--cyan); color: var(--cyan); padding: 11px 26px;
            font-family: 'Orbitron', sans-serif; font-size: 12px; letter-spacing: 2px; border-radius: 30px;
            cursor: pointer; transition: 0.25s; text-transform: uppercase; min-width: 130px; font-weight:500;
        }
        .btn:hover:not(:disabled) { background: rgba(0,255,204,0.12); box-shadow: 0 0 30px rgba(0,255,204,0.25); transform: translateY(-1px); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .btn.vermelho { border-color: var(--red); color: var(--red); }
        .btn.vermelho:hover:not(:disabled) { background: rgba(255,51,102,0.12); box-shadow: 0 0 30px rgba(255,51,102,0.25); }
        .btn.amarelo { border-color: var(--amber); color: var(--amber); }
        .btn.amarelo:hover:not(:disabled) { background: rgba(255,204,68,0.12); box-shadow: 0 0 30px rgba(255,204,68,0.25); }

        .status-msg { text-align: center; font-size: 13px; color: #8899aa; letter-spacing: 1px; padding: 9px; border-top: 1px solid var(--cyan-dim); margin-top: 6px; }
        .status-msg.verde { color: #66ff99; }
        .status-msg.vermelho { color: var(--red); }
        .status-msg.amarelo { color: var(--amber); }

        .footer-note{ text-align:center; font-size: 9.5px; color:#4c635f; margin-top:8px; letter-spacing:0.5px; }

        @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } .header h1 { font-size: 14px; } }
        @media (max-width: 500px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; } .stat-box .value { font-size: 17px; } .btn { font-size: 11px; padding: 9px 16px; min-width: 90px; } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>🕵️ DETECTA</h1>
                <span class="sub">SCANNER BIOMÉTRICO FACIAL · MALHA COMPLETA</span>
            </div>
            <span class="badge">v3.0 · PREMIUM</span>
        </div>

        <div class="video-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <div class="tac-grid"></div>
            <canvas id="overlay"></canvas>
            <div class="corner tl"></div>
            <div class="corner tr"></div>
            <div class="corner bl"></div>
            <div class="corner br"></div>
            <div class="scanline" id="scanline"></div>
            <div class="rec-indicator" id="recIndicator"><span class="dot"></span>ANALISANDO</div>
            <div class="id-tag" id="idTag">FACE_ID · TRACKING</div>
        </div>

        <div class="audio-visualizer">
            <canvas id="audioCanvas"></canvas>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><div class="label">🎯 Verdade</div><div class="value verde" id="porcentagem">--%</div></div>
            <div class="stat-box"><div class="label">❌ Mentira</div><div class="value vermelho" id="mentira">--%</div></div>
            <div class="stat-box"><div class="label">👁️ Piscadas</div><div class="value amarelo" id="piscadas">0</div></div>
            <div class="stat-box"><div class="label">📈 Tensão facial</div><div class="value" id="tensao">--%</div></div>
            <div class="stat-box"><div class="label">🫀 BPM (estimado)</div><div class="value" id="bpm">--</div></div>
            <div class="stat-box"><div class="label">⏱️ Tempo</div><div class="value" id="tempo">00:00</div></div>
        </div>

        <div class="controls">
            <button class="btn" id="btnIniciar">▶ Iniciar teste</button>
            <button class="btn vermelho" id="btnEncerrar" disabled>⏹ Encerrar</button>
            <button class="btn amarelo" id="btnRelatorio" disabled>📊 Relatório</button>
        </div>

        <div class="status-msg amarelo" id="statusMsg">🔬 Aguardando início da análise</div>
        <div class="footer-note">Brincadeira / entretenimento — não é um exame forense real.</div>
    </div>

    <script>
        // ============================================================
        //  DETECTA · SCANNER BIOMÉTRICO (VERSÃO PREMIUM)
        //  Malha facial completa (468/478 pontos MediaPipe) com os
        //  conjuntos oficiais de conexão (contorno, olhos, sobrancelhas,
        //  boca e íris), em vez de recortar os 68 primeiros índices —
        //  que ficavam concentrados na região dos olhos/nariz.
        // ============================================================

        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const audioCanvas = document.getElementById('audioCanvas');
        const ctxAudio = audioCanvas.getContext('2d');

        const spanPorcentagem = document.getElementById('porcentagem');
        const spanMentira = document.getElementById('mentira');
        const spanPiscadas = document.getElementById('piscadas');
        const spanTensao = document.getElementById('tensao');
        const spanBpm = document.getElementById('bpm');
        const spanTempo = document.getElementById('tempo');
        const statusMsg = document.getElementById('statusMsg');
        const scanline = document.getElementById('scanline');
        const recIndicator = document.getElementById('recIndicator');
        const idTag = document.getElementById('idTag');

        const btnIniciar = document.getElementById('btnIniciar');
        const btnEncerrar = document.getElementById('btnEncerrar');
        const btnRelatorio = document.getElementById('btnRelatorio');

        let testando = false;
        let stream = null;
        let faceMesh = null;
        let camera = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let audioAnimId = null;

        let historico = [];
        let piscadas = 0;
        let olhoFechadoAnterior = false;
        let tempoInicio = 0;
        let tempoDecorrido = 0;

        // sinais suavizados (para não "pular" a cada frame e parecer mais real)
        let sinalVerdade = 55;
        let sinalTensao = 10;
        let sinalBpm = 74;
        let landmarksAnteriores = null;

        // índices MediaPipe usados para o cálculo real de piscada (EAR)
        const OLHO_ESQ = { topo: 159, base: 145, canto1: 33, canto2: 133 };
        const OLHO_DIR = { topo: 386, base: 374, canto1: 362, canto2: 263 };
        const LIMIAR_PISCADA = 0.18;

        function resizeCanvas() {
            const rect = overlay.parentElement.getBoundingClientRect();
            overlay.width = rect.width;
            overlay.height = rect.height;
        }
        function resizeAudioCanvas() {
            const rect = audioCanvas.parentElement.getBoundingClientRect();
            audioCanvas.width = rect.width;
            audioCanvas.height = rect.height;
        }
        window.addEventListener('resize', () => { resizeCanvas(); resizeAudioCanvas(); });

        // ============================================================
        //  DESENHO DA MALHA FACIAL COMPLETA (estilo scanner biométrico)
        // ============================================================
        function desenharMalhaPremium(landmarks) {
            if (!landmarks) return;

            // 1) tesselação fina cobrindo o rosto inteiro (efeito "wireframe")
            if (window.FACEMESH_TESSELATION) {
                drawConnectors(ctx, landmarks, FACEMESH_TESSELATION, {
                    color: 'rgba(0,255,204,0.16)',
                    lineWidth: 0.6
                });
            }

            // 2) contornos principais em destaque (branco/ciano brilhante)
            const contornoStyle = { color: 'rgba(255,255,255,0.9)', lineWidth: 1.4 };
            const destaqueStyle = { color: 'rgba(0,255,204,0.95)', lineWidth: 1.6 };

            if (window.FACEMESH_FACE_OVAL) drawConnectors(ctx, landmarks, FACEMESH_FACE_OVAL, contornoStyle);
            if (window.FACEMESH_LEFT_EYEBROW) drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYEBROW, destaqueStyle);
            if (window.FACEMESH_RIGHT_EYEBROW) drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYEBROW, destaqueStyle);
            if (window.FACEMESH_LEFT_EYE) drawConnectors(ctx, landmarks, FACEMESH_LEFT_EYE, destaqueStyle);
            if (window.FACEMESH_RIGHT_EYE) drawConnectors(ctx, landmarks, FACEMESH_RIGHT_EYE, destaqueStyle);
            if (window.FACEMESH_LIPS) drawConnectors(ctx, landmarks, FACEMESH_LIPS, contornoStyle);
            if (window.FACEMESH_LEFT_IRIS) drawConnectors(ctx, landmarks, FACEMESH_LEFT_IRIS, { color: '#ffcc44', lineWidth: 1.4 });
            if (window.FACEMESH_RIGHT_IRIS) drawConnectors(ctx, landmarks, FACEMESH_RIGHT_IRIS, { color: '#ffcc44', lineWidth: 1.4 });

            // 3) ponte do nariz (não existe conector oficial pronto)
            const w = overlay.width, h = overlay.height;
            const p = (i) => ({ x: landmarks[i].x * w, y: landmarks[i].y * h });
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(p(6).x, p(6).y);
            ctx.lineTo(p(4).x, p(4).y);
            ctx.stroke();

            // 4) pontos de referência pulsantes em landmarks-chave
            const pontosChave = [1, 4, 33, 133, 362, 263, 61, 291, 10, 152, 234, 454];
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0,255,204,0.9)';
            ctx.shadowBlur = 6;
            for (const i of pontosChave) {
                const pt = p(i);
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 2.1, 0, 2 * Math.PI);
                ctx.fill();
            }
            ctx.shadowBlur = 0;
        }

        // ============================================================
        //  PISCADA — EAR (eye aspect ratio) real, não mais fixo/errado
        // ============================================================
        function calcularEAR(landmarks, olho) {
            const topo = landmarks[olho.topo], base = landmarks[olho.base];
            const c1 = landmarks[olho.canto1], c2 = landmarks[olho.canto2];
            const vertical = Math.hypot(topo.x - base.x, topo.y - base.y);
            const horizontal = Math.hypot(c1.x - c2.x, c1.y - c2.y);
            if (horizontal === 0) return 1;
            return vertical / horizontal;
        }

        function detectarPiscada(landmarks) {
            const earEsq = calcularEAR(landmarks, OLHO_ESQ);
            const earDir = calcularEAR(landmarks, OLHO_DIR);
            const media = (earEsq + earDir) / 2;
            return media < LIMIAR_PISCADA;
        }

        // ============================================================
        //  "TENSÃO FACIAL" — baseada em movimento real dos landmarks
        //  entre frames (quanto mais o rosto se mexe, maior o valor)
        // ============================================================
        function calcularMovimento(landmarksAtuais) {
            if (!landmarksAnteriores) return 0;
            let soma = 0;
            const passo = 4; // amostra parte dos pontos por performance
            let n = 0;
            for (let i = 0; i < landmarksAtuais.length; i += passo) {
                const a = landmarksAtuais[i], b = landmarksAnteriores[i];
                if (!a || !b) continue;
                soma += Math.hypot(a.x - b.x, a.y - b.y);
                n++;
            }
            return n ? soma / n : 0;
        }

        // ============================================================
        //  SINAIS "BIOMÉTRICOS" SUAVIZADOS (efeito de leitura real)
        // ============================================================
        function atualizarSinais(volume, movimento, piscouAgora) {
            sinalTensao += ((movimento * 4000) - sinalTensao) * 0.12;
            sinalTensao = Math.min(100, Math.max(0, sinalTensao));

            let alvoVerdade = 52 + (Math.sin(Date.now() / 4000) * 8);
            if (volume > 0.55) alvoVerdade -= volume * 22;
            if (sinalTensao > 45) alvoVerdade -= (sinalTensao - 45) * 0.5;
            if (piscouAgora) alvoVerdade -= 4;
            if (volume < 0.12 && sinalTensao < 20) alvoVerdade += 14;
            alvoVerdade += (Math.random() * 6 - 3);
            alvoVerdade = Math.min(96, Math.max(4, alvoVerdade));
            sinalVerdade += (alvoVerdade - sinalVerdade) * 0.07;

            const alvoBpm = 70 + volume * 30 + sinalTensao * 0.15;
            sinalBpm += (alvoBpm - sinalBpm) * 0.04;

            return {
                verdade: sinalVerdade,
                mentira: 100 - sinalVerdade,
                tensao: sinalTensao,
                bpm: sinalBpm
            };
        }

        // ============================================================
        //  PROCESSADOR DO MEDIAPIPE (FACE MESH)
        // ============================================================
        function onResults(results) {
            if (!testando) return;

            const width = overlay.width;
            const height = overlay.height;
            ctx.clearRect(0, 0, width, height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                let volume = 0;
                if (analyser && dataArray) {
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) soma += dataArray[i];
                    volume = (soma / dataArray.length) / 255;
                }

                const piscouAgora = detectarPiscada(landmarks);
                if (piscouAgora && !olhoFechadoAnterior) {
                    piscadas++;
                    spanPiscadas.textContent = piscadas;
                }
                olhoFechadoAnterior = piscouAgora;

                const movimento = calcularMovimento(landmarks);
                landmarksAnteriores = landmarks;

                const sinais = atualizarSinais(volume, movimento, piscouAgora);
                spanPorcentagem.textContent = Math.round(sinais.verdade) + '%';
                spanMentira.textContent = Math.round(sinais.mentira) + '%';
                spanTensao.textContent = Math.round(sinais.tensao) + '%';
                spanBpm.textContent = Math.round(sinais.bpm);

                desenharMalhaPremium(landmarks);
                idTag.classList.add('ativo');

                historico.push({
                    tempo: Date.now() - tempoInicio,
                    verdade: sinais.verdade,
                    mentira: sinais.mentira,
                    tensao: sinais.tensao,
                    bpm: sinais.bpm,
                    volume: volume,
                    piscadas: piscadas
                });

                if (sinais.verdade > 68) {
                    statusMsg.textContent = '✅ Alta probabilidade de verdade';
                    statusMsg.className = 'status-msg verde';
                } else if (sinais.verdade < 35) {
                    statusMsg.textContent = '⚠️ Alta probabilidade de mentira';
                    statusMsg.className = 'status-msg vermelho';
                } else {
                    statusMsg.textContent = '🔍 Análise inconclusiva';
                    statusMsg.className = 'status-msg amarelo';
                }

                tempoDecorrido = (Date.now() - tempoInicio) / 1000;
                const mins = Math.floor(tempoDecorrido / 60);
                const segs = Math.floor(tempoDecorrido % 60);
                spanTempo.textContent = `${String(mins).padStart(2, '0')}:${String(segs).padStart(2, '0')}`;

            } else {
                idTag.classList.remove('ativo');
                statusMsg.textContent = '👤 Nenhum rosto detectado';
                statusMsg.className = 'status-msg amarelo';
            }
        }

        // ============================================================
        //  ÁUDIO
        // ============================================================
        function desenharAudio() {
            const width = audioCanvas.width;
            const height = audioCanvas.height;
            ctxAudio.clearRect(0, 0, width, height);

            if (!analyser || !dataArray || !testando) {
                ctxAudio.beginPath();
                ctxAudio.moveTo(0, height / 2);
                ctxAudio.lineTo(width, height / 2);
                ctxAudio.strokeStyle = 'rgba(0, 255, 200, 0.15)';
                ctxAudio.lineWidth = 1.5;
                ctxAudio.stroke();
                audioAnimId = requestAnimationFrame(desenharAudio);
                return;
            }

            analyser.getByteFrequencyData(dataArray);

            const pct = parseInt(spanPorcentagem.textContent) || 50;
            const r = Math.round(255 * (1 - pct / 100));
            const g = Math.round(255 * (pct / 100));
            const b = 60;
            const cor = `rgba(${r}, ${g}, ${b}, 0.85)`;

            ctxAudio.beginPath();
            const step = Math.max(1, Math.floor(dataArray.length / width));
            for (let i = 0; i < width; i++) {
                const index = Math.min(i * step, dataArray.length - 1);
                const valor = dataArray[index] / 255;
                const y = height / 2 - (valor * (height / 2) * 0.8);
                if (i === 0) ctxAudio.moveTo(i, y);
                else ctxAudio.lineTo(i, y);
            }
            ctxAudio.strokeStyle = cor;
            ctxAudio.lineWidth = 2;
            ctxAudio.shadowColor = cor;
            ctxAudio.shadowBlur = 15;
            ctxAudio.stroke();

            let soma = 0;
            for (let i = 0; i < dataArray.length; i++) soma += dataArray[i];
            const vol = Math.round((soma / dataArray.length) / 255 * 100);

            ctxAudio.shadowBlur = 0;
            ctxAudio.fillStyle = 'rgba(0, 255, 200, 0.35)';
            ctxAudio.font = '9px "Share Tech Mono", monospace';
            ctxAudio.fillText(`VOL: ${vol}%`, 6, 14);
            ctxAudio.textAlign = 'right';
            ctxAudio.fillText(`VERDADE: ${spanPorcentagem.textContent}`, width - 6, 14);
            ctxAudio.textAlign = 'left';

            audioAnimId = requestAnimationFrame(desenharAudio);
        }

        // ============================================================
        //  INICIAR
        // ============================================================
        async function iniciarAnalise() {
            if (testando) return;

            try {
                historico = [];
                piscadas = 0;
                tempoInicio = Date.now();
                spanPiscadas.textContent = '0';
                olhoFechadoAnterior = false;
                landmarksAnteriores = null;
                sinalVerdade = 55;
                sinalTensao = 10;
                sinalBpm = 74;

                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: true
                });

                video.srcObject = stream;
                await video.play();
                resizeCanvas();
                resizeAudioCanvas();

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true, // habilita pontos de íris (mesh 478 pontos)
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onResults);

                camera = new Camera(video, {
                    onFrame: async () => {
                        try { await faceMesh.send({ image: video }); } catch (e) {}
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();

                testando = true;
                btnIniciar.disabled = true;
                btnEncerrar.disabled = false;
                btnRelatorio.disabled = true;
                statusMsg.textContent = '🔬 Analisando...';
                statusMsg.className = 'status-msg amarelo';
                scanline.classList.add('ativo');
                recIndicator.classList.add('ativo');

                if (audioAnimId) cancelAnimationFrame(audioAnimId);
                desenharAudio();

                console.log('✅ Scanner iniciado — malha facial completa ativa.');

            } catch (err) {
                console.error('❌ Erro:', err);
                statusMsg.textContent = '❌ Erro: ' + err.message;
                statusMsg.className = 'status-msg vermelho';
                btnIniciar.disabled = false;
                liberarRecursos();
            }
        }

        // ============================================================
        //  ENCERRAR E RELATÓRIO
        // ============================================================
        function encerrarAnalise() {
            testando = false;
            btnEncerrar.disabled = true;
            btnRelatorio.disabled = false;
            btnIniciar.disabled = true;
            statusMsg.textContent = '⏹ Análise encerrada.';
            statusMsg.className = 'status-msg amarelo';
            scanline.classList.remove('ativo');
            recIndicator.classList.remove('ativo');
            idTag.classList.remove('ativo');
            if (audioAnimId) { cancelAnimationFrame(audioAnimId); audioAnimId = null; }
            ctx.clearRect(0, 0, overlay.width, overlay.height);
            liberarRecursos();
        }

        function liberarRecursos() {
            if (audioContext && audioContext.state !== 'closed') { audioContext.close().catch(() => {}); audioContext = null; analyser = null; dataArray = null; }
            if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
            if (video.srcObject) { video.srcObject = null; }
            if (camera) { camera.stop(); camera = null; }
            faceMesh = null;
        }

        function gerarRelatorio() {
            if (historico.length === 0) { alert('Nenhum dado coletado.'); return; }
            let somaVerdade = 0, somaMentira = 0, somaTensao = 0, somaBpm = 0, picoMentira = 0, picoVerdade = 0;
            for (const item of historico) {
                somaVerdade += item.verdade; somaMentira += item.mentira;
                somaTensao += item.tensao; somaBpm += item.bpm;
                if (item.mentira > picoMentira) picoMentira = item.mentira;
                if (item.verdade > picoVerdade) picoVerdade = item.verdade;
            }
            const mediaVerdade = somaVerdade / historico.length;
            const mediaMentira = somaMentira / historico.length;
            const mediaTensao = somaTensao / historico.length;
            const mediaBpm = somaBpm / historico.length;
            const minutos = Math.floor(tempoDecorrido / 60);
            const segundos = Math.floor(tempoDecorrido % 60);

            const relatorio = `
════════════════════════════════════════════════════════
  🔬 RELATÓRIO — SCANNER BIOMÉTRICO
════════════════════════════════════════════════════════
 ✅ Média de VERDADE ......... ${mediaVerdade.toFixed(1)}%
 ❌ Média de MENTIRA ......... ${mediaMentira.toFixed(1)}%
 📈 Pico de VERDADE .......... ${picoVerdade.toFixed(1)}%
 📉 Pico de MENTIRA .......... ${picoMentira.toFixed(1)}%
 📊 Tensão facial média ...... ${mediaTensao.toFixed(1)}%
 🫀 BPM médio (estimado) ..... ${mediaBpm.toFixed(0)}
 👁️ Total de piscadas ........ ${piscadas}
 ⏱️ Tempo de análise ......... ${String(minutos).padStart(2, '0')}:${String(segundos).padStart(2, '0')}
════════════════════════════════════════════════════════
   Resultado gerado por brincadeira — sem valor forense.
════════════════════════════════════════════════════════
`;

            const janela = window.open('', '_blank', 'width=720,height=560');
            janela.document.write(`<html><head><title>Relatório</title><style>body{background:#07090a;color:#00ffcc;font-family:'Share Tech Mono','Courier New',monospace;padding:30px;white-space:pre-wrap;}</style></head><body><pre>${relatorio}</pre></body></html>`);
            janela.document.close();

            btnRelatorio.disabled = true;
            btnIniciar.disabled = false;
        }

        btnIniciar.addEventListener('click', iniciarAnalise);
        btnEncerrar.addEventListener('click', encerrarAnalise);
        btnRelatorio.addEventListener('click', gerarRelatorio);

        resizeCanvas();
        resizeAudioCanvas();
        console.log('📡 Scanner pronto — aguardando início.');
    </script>

</body>
</html>
